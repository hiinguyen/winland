# GlazeWM - Hyprland-style setup
# Modifier: Win key (lwin) - like SUPER on Hyprland.
# Installed by winland setup.ps1 (the Flow Launcher path is filled in at install time).

general:
  startup_commands: ['shell-exec zebar', 'shell-exec {{FLOW_LAUNCHER}}']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  focus_follows_cursor: true
  toggle_workspace_on_refocus: true
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '10px'
  # Bar is docked (reserves screen space). No outer gap: with focus following
  # the cursor, an edge gap let whatever window was behind grab focus.
  outer_gap:
    top: '0px'
    right: '0px'
    bottom: '0px'
    left: '0px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#89b4fa'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#313244'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '90%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: true
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'
  - name: '10'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # Small utility windows float instead of tiling.
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'CalculatorApp' }
      - window_class: { equals: 'OperationStatusWindow' }
      - window_class: { equals: '#32770' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -3%']
        bindings: ['h', 'left']
      - commands: ['resize --width +3%']
        bindings: ['l', 'right']
      - commands: ['resize --height +3%']
        bindings: ['k', 'up']
      - commands: ['resize --height -3%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']
  # Short-lived signal for the bar (see Win+Ctrl+F). Escape hatch in case the
  # bar is not running to switch it off.
  - name: 'overview-toggle'
    keybindings:
      - commands: ['wm-disable-binding-mode --name overview-toggle']
        bindings: ['escape', 'enter', 'lwin+ctrl+f']

keybindings:
  # --- Apps ---
  - commands: ['shell-exec wt']
    bindings: ['lwin+enter']
  - commands: ['shell-exec explorer']
    bindings: ['lwin+e']
  # Launcher (like rofi/wofi): apps, files, settings, calculator, web search.
  - commands: ['shell-exec {{FLOW_LAUNCHER}}']
    bindings: ['lwin+d']
  - commands: ['shell-exec chrome']
    bindings: ['lwin+b']
  - commands: ['shell-exec explorer ms-settings:']
    bindings: ['lwin+i']
  - commands: ['shell-exec taskmgr']
    bindings: ['lwin+shift+escape']
  - commands: ['shell-exec explorer ms-settings:sound']
    bindings: ['lwin+shift+a']
  - commands: ['shell-exec explorer ms-settings:network']
    bindings: ['lwin+shift+n']
  - commands: ['shell-exec explorer ms-settings:bluetooth']
    bindings: ['lwin+shift+b']

  # --- Window ---
  - commands: ['close']
    bindings: ['lwin+q']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+v']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+f']
  - commands: ['toggle-tiling']
    bindings: ['lwin+t']
  # Win+Ctrl+F: toggle the workspace between "big" (every window maximized) and
  # "overview" (all windows tiled side by side). The Zebar bar (layout.js) sees
  # this binding mode, performs the toggle and disables the mode again.
  - commands: ['wm-enable-binding-mode --name overview-toggle']
    bindings: ['lwin+ctrl+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+j']
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+c']

  # Focus (Win + arrows)
  - commands: ['focus --direction left']
    bindings: ['lwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+down']

  # Move window (Win + Shift + arrows)
  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']

  # Resize (Win + Alt + arrows), or Win+R for resize mode
  - commands: ['resize --width -3%']
    bindings: ['lwin+alt+left']
  - commands: ['resize --width +3%']
    bindings: ['lwin+alt+right']
  - commands: ['resize --height +3%']
    bindings: ['lwin+alt+up']
  - commands: ['resize --height -3%']
    bindings: ['lwin+alt+down']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r']

  # --- Workspaces ---
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+ctrl+left']
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+ctrl+right']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+tab']

  # Move current workspace to another monitor
  - commands: ['move-workspace --direction left']
    bindings: ['lwin+ctrl+shift+left']
  - commands: ['move-workspace --direction right']
    bindings: ['lwin+ctrl+shift+right']
  # Win + N: go to workspace N
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9']
  - commands: ['focus --workspace 10']
    bindings: ['lwin+0']

  # Win + Shift + N: move window to workspace N and follow
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['lwin+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['lwin+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['lwin+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['lwin+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['lwin+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['lwin+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['lwin+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['lwin+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['lwin+shift+9']
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['lwin+shift+0']

  # Win + Alt + N: move window to workspace N silently
  - commands: ['move --workspace 1']
    bindings: ['lwin+alt+1']
  - commands: ['move --workspace 2']
    bindings: ['lwin+alt+2']
  - commands: ['move --workspace 3']
    bindings: ['lwin+alt+3']
  - commands: ['move --workspace 4']
    bindings: ['lwin+alt+4']
  - commands: ['move --workspace 5']
    bindings: ['lwin+alt+5']
  - commands: ['move --workspace 6']
    bindings: ['lwin+alt+6']
  - commands: ['move --workspace 7']
    bindings: ['lwin+alt+7']
  - commands: ['move --workspace 8']
    bindings: ['lwin+alt+8']
  - commands: ['move --workspace 9']
    bindings: ['lwin+alt+9']
  - commands: ['move --workspace 10']
    bindings: ['lwin+alt+0']

  # --- WM control ---
  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+r']
  - commands: ['wm-redraw']
    bindings: ['lwin+shift+w']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+e']
